version: '3.8'

services:
  proxy-queue_test:
    build: .
    ports:
      - "6789:6789"   # HTTP/HTTPS proxy
      - "6799:6799"   # Socket proxy
      - "8081:8081"   # Health checks (when not shared)
      - "9090:9090"   # Metrics (when not shared)
    environment:
      - PROXY_LISTEN_PORT=6789
      - PROXY_TARGET_HOST=medium.com
      - PROXY_TARGET_PORT=443
      - PROXY_DELAY_MIN=1
      - PROXY_DELAY_MAX=5
      - PROXY_USE_HTTPS=true
      - PROXY_MAX_QUEUE_SIZE=1000
      - PROXY_METRICS_PORT=9090
      - PROXY_HEALTH_PORT=8081
      - PROXY_SHARED_HEALTH_PORT=false
      - PROXY_SHARED_METRICS_PORT=false
      - PROXY_HEADER_QUEUES=X-Amz-Security-Token,Authorization
      - PROXY_PERSISTENT_HEADERS=x-token-test:token-1234
      - PROXY_LOG_LEVEL=info
      # Optional proxy configuration (uncomment and configure as needed)
      # - PROXY_URL=http://corporate-proxy:8080
      # - PROXY_URL=socks5://proxy.company.com:1080
      # - PROXY_AUTH=username:password
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
